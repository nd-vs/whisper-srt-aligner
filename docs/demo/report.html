<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whisper SRT alignment report</title>
<style>
body { font: 15px/1.45 system-ui, sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; color: #1f2328; }
h1, h2 { line-height: 1.2; }
.summary { display: flex; flex-wrap: wrap; gap: .75rem; }
.metric { background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 8px; padding: .7rem 1rem; }
.metric strong { display: block; font-size: 1.35rem; }
table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
th, td { border: 1px solid #d0d7de; padding: .45rem .6rem; text-align: left; vertical-align: top; }
th { background: #f6f8fa; }
.dropped { color: #9a6700; }
.rescued { color: #8250df; }
.supplemented { color: #0969da; }
.inferred { color: #bf3989; }
code { word-break: break-all; }
</style>
<body>
<h1>Whisper SRT alignment report</h1>
<p>Subtitle: <code>source.srt</code><br>Transcript: <code>primary-transcript.json</code></p>
<div class="summary">
  <div class="metric"><strong>6</strong>kept cues</div>
  <div class="metric"><strong>0</strong>dropped cues</div>
  <div class="metric"><strong>0</strong>rescued cues</div>
  <div class="metric"><strong>0</strong>supplemented cues</div>
  <div class="metric"><strong>0</strong>inferred cues</div>
  <div class="metric"><strong>100.0%</strong>token coverage</div>
</div>
<h2 class="dropped">Dropped cues</h2>
<table><thead><tr><th>#</th><th>Original time</th><th>Text</th></tr></thead><tbody><tr><td colspan="3">None</td></tr></tbody></table>
<h2>Adjusted cues</h2>
<table><thead><tr><th>#</th><th>New time</th><th>Status</th><th>Text</th></tr></thead><tbody><tr><td colspan="4">None</td></tr></tbody></table>
</body>
</html>
