[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-srt-aligner"
version = "0.1.0"
description = "Rebuild SRT timing from Whisper while preserving and filtering the original subtitle text"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "whisper-srt-aligner contributors" },
]
keywords = ["subtitles", "srt", "whisper", "alignment", "ffmpeg"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "faster-whisper>=1.2.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[project.scripts]
whisper-srt-align = "whisper_srt_aligner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
